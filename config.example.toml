# claude-usage-lens configuration (example).
#
# Copy to your OS config dir and edit:
#   macOS   ~/Library/Application Support/claude-usage-lens/config.toml
#   Linux   ~/.config/claude-usage-lens/config.toml
#   Windows %APPDATA%\claude-usage-lens\config.toml
#
# Every value is OPTIONAL — sensible OS-specific defaults apply, and a missing
# file is not an error. Run `claude-usage-lens doctor` to see what resolved on
# your machine: it reports this file's path, whether it loaded, and which source
# paths ended up overridden. Use a different file with --config PATH.
#
# Precedence: command-line flags > this file > built-in / OS-inferred defaults.
#
# Unknown keys are rejected with an error rather than ignored — a typo here
# would otherwise look like a setting that works while silently doing nothing.

[sources]
# Override the auto-detected source roots. This is the safety valve when the
# inferred path is wrong — notably on Windows, where paths are unverified on
# real hardware. Leave unset to use the OS default.
# Equivalent flags: --code-root / --cowork-root.
# code_root   = "/custom/path/.claude/projects"
# cowork_root = "/custom/path/Claude/local-agent-mode-sessions"

# Override or extend the built-in per-model rate table, keyed by model id.
# Prices are USD per 1,000,000 tokens; multipliers are relative to input price.
#
# Every field is optional and INHERITS when omitted — for a model the built-in
# table knows, from that entry; for one it doesn't, from the standard multipliers
# (cache read 0.1x, 5m write 1.25x, 1h write 2x, web search $0.01/request). So
# overriding one price leaves the rest of the entry intact.
#
# A price change affects newly ingested records only, because ingest is
# incremental. Run `claude-usage-lens reprice` afterwards to apply it to the
# history already in the store.

# Cost Sonnet 5 at its introductory rate instead of the durable $3 / $15:
# [pricing.models."claude-sonnet-5"]
# input_per_mtok  = 2.0
# output_per_mtok = 10.0

# Price a model released after this build — multipliers come for free:
# [pricing.models."claude-future-9"]
# input_per_mtok  = 7.0
# output_per_mtok = 35.0

# The full set of fields, for reference. fast_* is the `speed: "fast"` premium
# tier (Opus 5 / Opus 4.8); leaving both at 0 means the model has no fast mode,
# and a fast-flagged record is then billed at the standard rate.
# [pricing.models."claude-opus-5"]
# input_per_mtok            = 5.0
# output_per_mtok           = 25.0
# fast_input_per_mtok       = 10.0
# fast_output_per_mtok      = 50.0
# cache_read_multiplier     = 0.1
# cache_write_1h_multiplier = 2.0
# cache_write_5m_multiplier = 1.25
# web_search_per_req        = 0.01
# web_fetch_per_req         = 0.0
